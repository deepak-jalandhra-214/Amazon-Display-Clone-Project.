<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="amazon-clone.css">
</head>
<body>
    <header>
        <div class="navbar">
           <div class="nav-logo border">
              <div class="logo"></div>
            </div>
            <div class="nav-address">
                <p style=" position:relative; left:18px;top:6px">Deliver to</p>
                <div class="nav-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p>India</p>
                </div>
            </div>
            <div class="nav-search">
                <select class="search-select">
                    <option>All</option>
                </select >
                <input placeholder="   Amazon Search" class="search-input">
                <div class="nav-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            <div class="nav-language">
                <div class="nav-icon">
                    <i class="fa-solid fa-flag-usa"></i>
                </div>
                <div class="nav-option">
                    <select>    
                        <option>EN</option>
                    </select>
                </div>
            </div>
            <div class="nav-signin">
                <p><span>Hello, sign in</span></p>
                <p class="account">Account & Lists</p>
            </div>
            <div class="nav-orders">
                <p><span>Returns</span></p>
                <p class="orders">& Orders</p>
            </div>
            <div class="nav-cart-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                <div class="cart">
                <p>Cart</p>
                </div>
            </div>
            
        </div>
    </header>
</body>
</html>
